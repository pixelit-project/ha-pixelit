show_message:
  target:
    entity:
      integration: pixelit
      domain: light
  fields:
    message:
      required: true
      example: Waschmaschine fertig
      selector:
        text: null
    icon:
      example: 42
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    color:
      default: '#FFFFFF'
      selector:
        text:
          type: color
    transition:
      default: none
      selector:
        select:
          options:
          - none
          - random
          - fade
          - colored_bar_wipe
          - zigzag_wipe
          - bitmap_wipe
          - curtain
          - pixel_dissolve
          - slide
          - blinds
          - crt
          - glitch
          - vertical_slide
          translation_key: transition
    text_options:
      collapsed: true
      fields:
        scroll:
          default: auto
          selector:
            select:
              options:
              - auto
              - always
              - 'off'
              translation_key: scroll
        large_font:
          default: false
          selector:
            boolean: null
        center:
          default: true
          selector:
            boolean: null
    advanced_options:
      collapsed: true
      fields:
        icon_rubberbanding:
          default: false
          selector:
            boolean: null
        icon_limit_loops:
          default: 0
          selector:
            number:
              min: 0
              max: 2147483647
              step: 1
              mode: box
        icon_animation_delay:
          default: 100
          selector:
            number:
              min: 10
              max: 60000
              step: 1
              unit_of_measurement: ms
              mode: box
        protection_duration:
          default: 0
          selector:
            number:
              min: 0
              max: 86400
              step: 1
              unit_of_measurement: s
              mode: box
        transition_bitmap:
          example: 42
          selector:
            number:
              min: 1
              max: 2147483647
              mode: box
