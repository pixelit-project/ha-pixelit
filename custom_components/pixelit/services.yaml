show_message:
  target:
    entity:
      integration: pixelit
      domain: light
  fields:
    message:
      required: true
      example: Waschmaschine fertig
      selector:
        text: null
    icon:
      example: 42
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    text_options:
      collapsed: true
      fields:
        color:
          default: '#FFFFFF'
          selector:
            text:
              type: color
        gradient_end:
          selector:
            text:
              type: color
        rainbow:
          selector:
            boolean: null
        gradient_direction:
          selector:
            select:
              options:
              - left_to_right
              - right_to_left
              - top_to_bottom
              - bottom_to_top
              - top_left_to_bottom_right
              - bottom_right_to_top_left
              - top_right_to_bottom_left
              - bottom_left_to_top_right
              translation_key: gradient_direction
        character_colors:
          example: '["#FFFFFF", null, "#FFD000"]'
          selector:
            object: null
        scroll:
          default: auto
          selector:
            select:
              options:
              - auto
              - always
              - 'off'
              translation_key: scroll
        large_font:
          default: false
          selector:
            boolean: null
        center:
          default: true
          selector:
            boolean: null
    icon_animation_options:
      collapsed: true
      fields:
        icon_rubberbanding:
          default: false
          selector:
            boolean: null
        icon_limit_loops:
          default: 0
          selector:
            number:
              min: 0
              max: 2147483647
              step: 1
              mode: box
        icon_animation_delay:
          default: 100
          selector:
            number:
              min: 10
              max: 60000
              step: 1
              unit_of_measurement: ms
              mode: box
    transition_options:
      collapsed: true
      fields:
        transition:
          default: none
          selector:
            select:
              options:
              - none
              - random
              - fade
              - colored_bar_wipe
              - zigzag_wipe
              - bitmap_wipe
              - curtain
              - pixel_dissolve
              - slide
              - blinds
              - crt
              - glitch
              - vertical_slide
              translation_key: transition
        transition_bitmap:
          example: 42
          selector:
            number:
              min: 1
              max: 2147483647
              mode: box
    advanced_options:
      collapsed: true
      fields:
        protection_duration:
          default: 0
          selector:
            number:
              min: 0
              max: 86400
              step: 1
              unit_of_measurement: s
              mode: box
